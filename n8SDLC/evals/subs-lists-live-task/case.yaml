schema_version: "1.1"
name: subs-lists-live-task
description: >
  0.7.0 /n8-subs: with a background shell running, the inventory lists it with its command,
  running time and a status, and offers (never performs) a stop.
tags: [v0.7, n8-subs]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >
    Start `sleep 900` as a background task (it stands in for a long job), then run /n8-subs
    and show me the result.
  allowed_tools: [Bash, Read, Glob, Grep, Skill, TaskStop]
  max_turns: 25
  timeout_seconds: 400
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?n8-subs"'
    arm: with-only
  - name: nothing-stopped-unasked
    type: tool_used
    tool: TaskStop
    min: 0
    max: 0
  - name: inventory
    type: llm
    criteria: >
      The final message contains an inventory (a table or list) that includes the `sleep 900`
      task with a running time and a status, and an expected completion or an honest "unknown".
      If it suggests stopping anything, it asks rather than reporting it stopped.
