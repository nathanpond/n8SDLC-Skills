schema_version: "1.1"
name: upgrade-finds-07-gaps
description: >
  0.7.0 /n8-upgrade on a project set up with 0.6.0 whose dependabot.yml lacks github-actions.
  It must find the missing CLAUDE.md background-work paragraph and the dependabot gap, propose
  fixes, and ask once before applying. It must not record the new version before the fixes land.
tags: [v0.7, n8-upgrade]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "/n8-upgrade"
  allowed_tools: [Bash, Read, Glob, Grep, Edit, Write, Skill]
  max_turns: 40
  timeout_seconds: 600
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?n8-upgrade"'
    arm: with-only
  - name: version-not-recorded-early
    type: regex
    target: { source: file, path: .n8/config.yml }
    pattern: 'plugin_version: 0\.6\.0'
  - name: findings-and-approval-gate
    type: llm
    criteria: >
      The final message (1) names the CLAUDE.md n8SDLC section as missing the background-work
      paragraph that mentions /n8-subs; (2) names .github/dependabot.yml as missing the
      github-actions ecosystem; (3) proposes a concrete fix for each; and (4) asks the user to
      approve before applying anything, rather than reporting the fixes as already applied.
      Failing to reach GitHub (no network) may be reported, but must not be presented as the
      project being current.
